name: Rust

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --verbose

      # The runner kernel has CONFIG_TCP_AO=y; require it so a runner that
      # loses TCP-AO fails here instead of silently skipping those tests.
      - name: Run tests
        env:
          FOCL_REQUIRE_TCP_AO: "1"
        run: cargo test --verbose
